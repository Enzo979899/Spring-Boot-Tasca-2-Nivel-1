<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1040" viewBox="0 0 1700 1040">
<!--
Generated from the following Mermaid class diagram source:

classDiagram
    direction LR

    class FruitController {
        <<RestController>>
        -FruitService fruitService
        +create(FruitRequest) ResponseEntity~FruitResponse~
        +findAll() List~FruitResponse~
        +findById(Long) FruitResponse
        +update(Long, FruitRequest) FruitResponse
        +delete(Long) ResponseEntity~Void~
    }

    class FruitService {
        <<Service>>
        -FruitRepository fruitRepository
        +create(Fruit) Fruit
        +findAll() List~Fruit~
        +findById(Long) Fruit
        +update(Long, Fruit) Fruit
        +delete(Long) void
    }

    class FruitRepository {
        <<Repository / Interface>>
        +save(Fruit) Fruit
        +findAll() List~Fruit~
        +findById(Long) Optional~Fruit~
        +delete(Fruit) void
    }

    class Fruit {
        <<Entity>>
        -Long id
        -String name
        -double weightInKilos
        +Fruit()
        +Fruit(Long, String, double)
        +getId() Long
        +getName() String
        +getWeightInKilos() double
    }

    class FruitRequest {
        <<DTO / record>>
        +String name
        +double weightInKilos
    }

    class FruitResponse {
        <<DTO / record>>
        +Long id
        +String name
        +double weightInKilos
        +from(Fruit) FruitResponse
    }

    class FruitNotFoundException {
        <<RuntimeException>>
        +FruitNotFoundException(Long)
    }

    class ApiError {
        <<record>>
        +int status
        +String error
        +String message
    }

    class GlobalExceptionHandler {
        <<RestControllerAdvice>>
        +handleFruitNotFound(FruitNotFoundException) ResponseEntity~ApiError~
        +handleValidation(MethodArgumentNotValidException) ResponseEntity~ApiError~
    }

    FruitController --> FruitService : uses
    FruitController ..> FruitRequest : receives
    FruitController ..> FruitResponse : returns
    FruitController ..> Fruit : maps

    FruitService --> FruitRepository : uses
    FruitService ..> FruitNotFoundException : throws

    FruitRepository --> Fruit : persists
    FruitResponse ..> Fruit : maps from

    GlobalExceptionHandler ..> FruitNotFoundException : handles
    GlobalExceptionHandler ..> ApiError : returns

-->
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
  </marker>
  <style>
