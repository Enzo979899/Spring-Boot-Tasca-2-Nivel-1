    .head { fill:#f1f5f9; stroke:#334155; stroke-width:2; }
    .title { font: 700 22px Arial, sans-serif; fill:#0f172a; }
    .stereo { font: italic 16px Arial, sans-serif; fill:#475569; }
    .member { font: 16px Consolas, "Courier New", monospace; fill:#1e293b; }
    .line { stroke:#334155; stroke-width:2.2; fill:none; marker-end:url(#arrow); }
    .dash { stroke:#64748b; stroke-width:2; fill:none; stroke-dasharray:8 7; marker-end:url(#arrow); }
    .label { font: 15px Arial, sans-serif; fill:#475569; }
    .diagram-title { font: 700 30px Arial, sans-serif; fill:#0f172a; }
    .diagram-subtitle { font: 16px Arial, sans-serif; fill:#64748b; }
  </style>
</defs>

